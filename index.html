<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>West Beach Club Dashboard</title>
  <style>
    :root {
      --navy:#0b2f4f; --blue:#1e6f9f; --sand:#f4efe4; --white:#ffffff; --muted:#6b7280; --line:#d8e2ea;
    }
    * { box-sizing: border-box; }
    html, body {
      margin:0; padding:0; width:100%; height:100%;
      overflow:hidden; font-family: Arial, Helvetica, sans-serif;
      background:var(--sand); color:var(--navy);
    }

    /*
      All sizing below uses vw/vh (viewport-relative) units instead of
      fixed px. This is what makes the whole dashboard scale perfectly
      to fill a 43" TV edge-to-edge: vw/vh always equal 1% of the
      actual screen width/height, on any resolution (1080p, 4K, etc),
      so every element - fonts, padding, icons, gaps - grows or
      shrinks together and the proportions never change.
    */

    /* Top navy header bar: club name + location on the left, live
       date on the right. Fixed height in vh, with the main content
       grid below sized to fill exactly the remaining viewport height
       via calc(), so nothing overflows the screen. */
    .topbar {
      height: 9vh;
      width: 100%;
      background: var(--navy);
      border-bottom: 0.3vh solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2vw;
      color: #fff;
      box-sizing: border-box;
    }
    .topbar .brandblock { line-height: 1.1; }
    .topbar .brandblock .name {
      font-size: 2.1vw; font-weight: 800; letter-spacing: 0.1vw;
    }
    .topbar .brandblock .place {
      font-size: 1.05vw; font-weight: 600; letter-spacing: 0.2vw;
      text-transform: uppercase; color: #cfe3f0; margin-top: 0.3vh;
    }
    .topbar .date {
      font-size: 1.7vw; font-weight: 700; white-space: nowrap;
    }

    .screen {
      width: 100%;
      height: calc(100vh - 9vh);
      display:grid; grid-template-columns: 72% 28%; gap:0;
    }
    .slides { background:#000; height: 100%; }
    .slides iframe { width:100%; height:100%; border:0; display:block; }

    .panel {
      height: 100%;
      padding: 1.6vh 1.6vw;
      background:linear-gradient(180deg,#fff 0%,#f7fbfd 100%);
      border-left: 0.3vw solid var(--blue);
      display: grid;
      /* Exact height budget, top to bottom: brand label, weather
         card, tides card, forecast card, with gaps between each.
         These fractions are sized in `fr` units relative to each
         other and ALWAYS sum to fill exactly 100% of the panel's
         height - so on a short laptop screen the cards shrink
         together instead of overflowing and getting clipped by
         overflow:hidden, which is what was cutting off the 3-day
         forecast card before. */
      grid-template-rows: auto 2.55fr 2.55fr 1.9fr;
      gap: 1.2vh;
      overflow: hidden;
      min-height: 0;
    }
    .panel > * { min-height: 0; overflow: hidden; }

    .brand { text-align:center; border-bottom:0.1vh solid var(--line); padding-bottom:1.4vh; }
    .brand .sub { font-size:1.2vw; color:var(--muted); text-transform:uppercase; letter-spacing:0.15vw; font-weight:700; }

    .card {
      background:var(--white); border:0.1vh solid var(--line);
      border-radius:1.4vw; padding:1.2vh 1.4vw;
      box-shadow:0 0.2vh 1vh rgba(11,47,79,.08);
      display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
    }
    .card h2 {
      margin:0 0 0.6vh 0; font-size: min(1.45vw, 2.2vh);
      letter-spacing:0.04vw; text-transform:uppercase;
      flex-shrink: 0;
    }
    /* Wraps everything in a card below the h2 so it can flex to fill
       the card's remaining height - this is what lets tide rows and
       forecast columns shrink together to fit a short screen instead
       of overflowing past a fixed size. */
    .card-body {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      overflow: hidden;
    }

    .weather-main { display:flex; align-items:center; justify-content:space-between; gap:0.8vw; flex-shrink: 0; }
    .temp { font-size: min(4.6vw, 6vh); line-height:1; font-weight:800; }
    .condition { font-size: min(1.5vw, 2.2vh); margin-top:0.4vh; color:var(--blue); font-weight:700; }
    .icon { font-size: min(4.4vw, 5.5vh); }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:0.6vw; margin-top:0.8vh; flex-shrink: 0; }
    .metric { background:#f4f8fb; border-radius:0.9vw; padding:0.7vh 0.8vw; }
    .label { color:var(--muted); font-size: min(0.95vw, 1.5vh); text-transform:uppercase; letter-spacing:0.05vw; }
    .value { font-size: min(1.6vw, 2.3vh); margin-top:0.2vh; font-weight:800; }

    .tide-row {
      display:flex; justify-content:space-between; align-items:center;
      border-top:0.1vh solid var(--line); font-size: min(1.45vw, 2.1vh);
      flex: 1; min-height: 0;
    }
    .tide-row:first-of-type { border-top:0; }
    .tide-type { font-weight:800; }
    .tide-time { color:var(--blue); font-weight:800; }

    .forecast {
      display:grid; grid-template-columns:repeat(3,1fr); gap:0.6vw;
      flex: 1; min-height: 0; overflow: hidden;
    }
    .day {
      background:#f4f8fb; border-radius:0.9vw; padding:0.6vh 0.4vw; text-align:center;
      display: flex; flex-direction: column; justify-content: center; min-height: 0;
    }
    .day-name { font-size: min(0.95vw, 1.4vh); text-transform:uppercase; color:var(--muted); letter-spacing:0.04vw; }
    .day-icon { font-size: min(2.2vw, 3.2vh); margin:0.3vh 0; }
    .day-temp { font-size: min(1.35vw, 2vh); font-weight:800; }

    .error { color:#9f1e1e; font-weight:700; font-size:1vw; line-height:1.35; }

    /*
      Fallback for unusually narrow/tall windows (e.g. a portrait
      monitor used for testing on a laptop instead of the TV): clamp
      font sizes so text never becomes illegibly small or grotesquely
      huge outside the 16:9 TV context this was designed for.
    */
    @media (max-aspect-ratio: 4/5) {
      .panel { padding: 2vh 2.4vw; }
      .temp { font-size: 9vw; }
      .icon { font-size: 8vw; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brandblock">
      <div class="name">WEST BEACH CLUB</div>
      <div class="place">Hyannis Port</div>
    </div>
    <div class="date" id="liveDate">--</div>
  </header>

  <main class="screen">
    <section class="slides">
      <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQSGyCIN9DPZhBSnBSsRwqBEY_bkyZI1ety04JSmHb7qx6tMf7fQuhv0Ayk7jofSyjOLMJQm3s3Zm_8/embed?start=true&loop=true&delayms=10000" allowfullscreen="true"></iframe>
    </section>

    <aside class="panel">
      <div class="brand">
        <div class="sub">Today's Conditions</div>
      </div>

      <section class="card" id="weatherCard">
        <h2>Weather</h2>
        <div class="card-body">
          <div class="weather-main">
            <div>
              <div class="temp" id="temp">--°</div>
              <div class="condition" id="condition">Loading…</div>
            </div>
            <div class="icon" id="weatherIcon">☀️</div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">High / Low</div><div class="value" id="hiLow">-- / --</div></div>
            <div class="metric"><div class="label">Wind</div><div class="value" id="wind">-- mph</div></div>
            <div class="metric"><div class="label">Rain Chance</div><div class="value" id="rain">--%</div></div>
            <div class="metric"><div class="label">Water Temp</div><div class="value" id="waterTemp">--°</div></div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Hyannisport Tides</h2>
        <div class="card-body" id="tides"><div class="condition">Loading tides…</div></div>
      </section>

      <section class="card">
        <h2>3-Day Forecast</h2>
        <div class="forecast" id="forecast"></div>
      </section>
    </aside>
  </main>

<script>
const LAT = 41.632;       // Hyannisport, MA
const LON = -70.300;
const TIDE_STATION = '8447605';
const WEATHER_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FNew_York&forecast_days=3`;
// Marine API lives on a separate host from the main forecast API and
// only documents &hourly= (not &current=) as a reliable parameter, so
// we request the hourly series and read off today's first (current)
// hour rather than relying on an unconfirmed &current= shortcut.
const MARINE_URL = `https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}&hourly=sea_surface_temperature&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=1`;

function iconFor(code){
  if ([0].includes(code)) return '☀️';
  if ([1,2].includes(code)) return '🌤️';
  if ([3].includes(code)) return '☁️';
  if ([45,48].includes(code)) return '🌫️';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if ([71,73,75,77,85,86].includes(code)) return '❄️';
  if ([95,96,99].includes(code)) return '⛈️';
  return '🌤️';
}
function textFor(code){
  const map = {0:'Clear',1:'Mainly Sunny',2:'Partly Cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',61:'Light Rain',63:'Rain',65:'Heavy Rain',80:'Rain Showers',81:'Rain Showers',82:'Heavy Showers',95:'Thunderstorms'};
  return map[code] || 'Current Conditions';
}
function dayName(dateStr){
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
}

async function loadWeather(){
  try {
    const r = await fetch(WEATHER_URL, {cache:'no-store'});
    const d = await r.json();
    const c = d.current;
    document.getElementById('temp').textContent = Math.round(c.temperature_2m) + '°';
    document.getElementById('condition').textContent = textFor(c.weather_code);
    document.getElementById('weatherIcon').textContent = iconFor(c.weather_code);
    document.getElementById('hiLow').textContent = `${Math.round(d.daily.temperature_2m_max[0])}° / ${Math.round(d.daily.temperature_2m_min[0])}°`;
    document.getElementById('wind').textContent = `${Math.round(c.wind_speed_10m)} mph`;
    document.getElementById('rain').textContent = `${d.daily.precipitation_probability_max[0] ?? 0}%`;
    const f = document.getElementById('forecast');
    f.innerHTML = '';
    for(let i=0;i<3;i++){
      f.innerHTML += `<div class="day"><div class="day-name">${i===0?'Today':dayName(d.daily.time[i])}</div><div class="day-icon">${iconFor(d.daily.weather_code[i])}</div><div class="day-temp">${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°</div></div>`;
    }
  } catch(e){
    document.getElementById('condition').innerHTML = '<span class="error">Weather unavailable. Check internet connection.</span>';
  }
}

async function loadWaterTemp(){
  const el = document.getElementById('waterTemp');
  try {
    const r = await fetch(MARINE_URL, {cache:'no-store'});
    const d = await r.json();
    const series = d && d.hourly && d.hourly.sea_surface_temperature;
    if (!series || !series.length || series[0] === null || series[0] === undefined) {
      el.textContent = '--°';
      return;
    }
    el.textContent = Math.round(series[0]) + '°';
  } catch(e){
    // Marine data can be unavailable for some near-shore points, or
    // the request can fail independently of the main weather call -
    // fail gracefully without breaking the rest of the dashboard.
    el.textContent = '--°';
  }
}

async function loadTides(){
  const today = new Date();
  const tomorrow = new Date(today.getTime()+24*60*60*1000);
  const b = today.toISOString().slice(0,10).replaceAll('-','');
  const e = tomorrow.toISOString().slice(0,10).replaceAll('-','');
  const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${b}&end_date=${e}&station=${TIDE_STATION}&product=predictions&datum=MLLW&time_zone=lst_ldt&interval=hilo&units=english&format=json`;
  try {
    const r = await fetch(url, {cache:'no-store'});
    const d = await r.json();
    const now = new Date();
    const upcoming = (d.predictions || []).filter(x => new Date(x.t.replace(' ','T')) >= now).slice(0,4);
    const el = document.getElementById('tides');
    if (!upcoming.length) { el.innerHTML = '<div class="error">Tide data unavailable.</div>'; return; }
    el.innerHTML = upcoming.map(x => {
      const dt = new Date(x.t.replace(' ','T'));
      const type = x.type === 'H' ? 'High Tide' : 'Low Tide';
      return `<div class="tide-row"><span class="tide-type">${type}</span><span class="tide-time">${dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span></div>`;
    }).join('');
  } catch(e){
    document.getElementById('tides').innerHTML = '<div class="error">Tides unavailable. Check internet connection.</div>';
  }
}

async function refreshAll(){
  await loadWeather();
  await loadWaterTemp();
  await loadTides();
}

function updateDate(){
  const el = document.getElementById('liveDate');
  if (!el) return;
  const now = new Date();
  // Matches the reference header format: "Sunday, June 21" (weekday,
  // month, day - no year, since the TV display is always "today").
  el.textContent = now.toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric',
  });
}

refreshAll();
setInterval(refreshAll, 15*60*1000);

updateDate();
// Checked once a minute (not once a day) so the date rolls over
// correctly if the TV is left running overnight past midnight,
// without needing a full page reload to catch it.
setInterval(updateDate, 60*1000);
</script>
</body>
</html>
